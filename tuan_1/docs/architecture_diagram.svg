<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1170" viewBox="0 0 1500 1170">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/></marker></defs>
<style>text{font-family:'Times New Roman',serif;fill:#111;text-anchor:middle}.title{font-size:42px;font-weight:bold}.name{font-size:38px;font-weight:bold}.body{font-size:32px}.label{font-size:29px}.box{fill:#fff;stroke:#333;stroke-width:3}.head{fill:#eee}.edge{fill:none;stroke:#333;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1500" height="1170" fill="white"/>
<text class="title" x="750" y="55">KIẾN TRÚC VÀ LUỒNG DỮ LIỆU</text>
<g><rect class="box" x="40" y="110" width="430" height="150" rx="12"/><text class="name" x="255" y="160">Amazon EventBridge</text><text class="body" x="255" y="205">Lịch thu thập theo giờ</text><text class="body" x="255" y="242">rate(1 hour)</text></g>
<g><rect class="box" x="535" y="110" width="430" height="150" rx="12"/><text class="name" x="750" y="160">Open-Meteo API</text><text class="body" x="750" y="205">Thời tiết và chất lượng</text><text class="body" x="750" y="242">không khí của ba đô thị</text></g>
<g><rect class="box" x="1030" y="110" width="430" height="150" rx="12"/><text class="name" x="1245" y="160">Secrets Manager</text><text class="body" x="1245" y="205">Vị trí và ngưỡng cảnh báo</text><text class="body" x="1245" y="242">weather/api_config</text></g>
<path class="edge" d="M255 260 V300 H525 V340"/><path class="edge" d="M750 260 V340"/><path class="edge" d="M1245 260 V300 H975 V340"/>
<g><rect class="box" x="400" y="350" width="700" height="175" rx="12"/><text class="name" x="750" y="400">AWS Lambda</text><text class="body" x="750" y="445">WeatherCollectorLambda</text><text class="body" x="750" y="489">Thu thập → chuẩn hóa → phân loại AQI</text></g>
<path class="edge" d="M525 525 V575 H255 V620"/><path class="edge" d="M750 525 V620"/><path class="edge" d="M975 525 V575 H1245 V620"/>
<g><rect class="box" x="40" y="630" width="430" height="160" rx="12"/><text class="name" x="255" y="681">Amazon S3</text><text class="body" x="255" y="727">NDJSON, vùng raw</text><text class="body" x="255" y="766">Phân vùng năm / tháng / ngày</text></g>
<g><rect class="box" x="535" y="630" width="430" height="160" rx="12"/><text class="name" x="750" y="681">Amazon SNS</text><text class="body" x="750" y="727">Tiếp nhận thông báo</text><text class="body" x="750" y="766">Email đã xác nhận đăng ký</text></g>
<g><rect class="box" x="1030" y="630" width="430" height="160" rx="12"/><text class="name" x="1245" y="681">Amazon CloudWatch</text><text class="body" x="1245" y="727">Logs, metrics, alarm</text><text class="body" x="1245" y="766">Lượt gọi, lỗi, thời gian chạy</text></g>
<path class="edge" d="M255 790 V915"/>
<path class="edge" d="M470 735 H500 V865 H750 V915"/><text class="label" x="690" y="847">Đọc dữ liệu S3</text>
<g><rect class="box" x="40" y="925" width="430" height="160" rx="12"/><text class="name" x="255" y="976">AWS Glue Catalog</text><text class="body" x="255" y="1022">Lược đồ và phân vùng</text><text class="body" x="255" y="1061">weather_aqi_db</text></g>
<path class="edge" d="M470 1005 H525"/>
<g><rect class="box" x="535" y="925" width="430" height="160" rx="12"/><text class="name" x="750" y="976">Amazon Athena</text><text class="body" x="750" y="1022">SQL → CSV tổng hợp</text><text class="body" x="750" y="1061">Bảng số liệu và biểu đồ</text></g>
<text class="label" x="1215" y="981">Cảnh báo của dự án:</text><text class="body" x="1215" y="1025">AQI ≥ 100 hoặc</text><text class="body" x="1215" y="1069">PM2.5 ≥ 35,5 µg/m³</text>
<text class="label" x="750" y="1140">Luồng thiết kế; số liệu quan sát được trình bày trong các bảng báo cáo.</text>
</svg>
